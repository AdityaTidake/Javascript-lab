<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JavaScript Array Objects</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        text-align: center;
      }

      .container {
        width: 500px;
        margin: auto;
        padding: 25px;
        border: 1px solid #aaa;
        border-radius: 8px;
      }

      input {
        padding: 8px;
        margin: 10px;
      }

      button {
        padding: 9px 18px;
        cursor: pointer;
      }

      #result {
        margin-top: 20px;
        text-align: left;
        line-height: 1.8;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>JavaScript Arrays</h1>

      <label>Enter size of array:</label>

      <input type="number" id="arraySize" min="1" placeholder="Enter size" />

      <br />

      <button onclick="createArray()">Create Array</button>

      <div id="result"></div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown Timer</title>

    <style>
        /* Page styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Rectangle containing all page content */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 35px;
            background-color: white;
            border: 1px solid #dcdfe5;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            box-sizing: border-box;
        }

        /* Heading */
        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
        }

        /* Date and time label */
        label {
            display: block;
            color: #444;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Date and time hint */
        .hint {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 12px;
        }

        /* Date and time input */
        input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            margin: 0 0 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            background-color: #fafafa;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.2);
        }

        /* Validation message */
        #message {
            color: #dc3545;
            font-size: 14px;
            min-height: 18px;
            margin-bottom: 15px;
        }

        /* Buttons */
        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            margin: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Reset button */
        #resetBtn {
            background-color: #dc3545;
        }

        #resetBtn:hover {
            background-color: #a71d2a;
        }

        /* Countdown display */
        #countdown {
            margin-top: 30px;
            margin-bottom: 0;
            padding: 20px 10px;
            font-size: 22px;
            line-height: 1.6;
            color: #222;
            background-color: #f4f7ff;
            border: 1px solid #dce5ff;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        /* Expired message */
        #expired {
            color: red;
            font-weight: bold;
        }

        /* Responsive styling */
        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
            }

            h2 {
                font-size: 24px;
            }

            button {
                padding: 11px 14px;
                font-size: 14px;
            }

            #countdown {
                font-size: 17px;
            }
        }
    </style>

</head>

<body>

    <!-- Rectangle containing all content -->
    <div class="container">

        <h2>Countdown Timer</h2>

        <label for="endDate">Select End Date and Time:</label>

        <small class="hint">
            Example: 12/25/2027, 11:59 PM
        </small>

        

        <input

            type="datetime-local"
            id="endDate"
            aria-label="Select countdown end date and time"
             
        >

        <!-- Validation message -->
        <div id="message" role="status" aria-live="polite"></div>

        <!-- Buttons -->
        <button type="button" id="startBtn">
            Start Timer
        </button>

        <button type="button" id="resetBtn">
            Reset Timer
        </button>

        <!-- Countdown display -->
        <h3 id="countdown">
            00 Days : 00 Hours : 00 Minutes : 00 Seconds
        </h3>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>

</html>

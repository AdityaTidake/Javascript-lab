<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Array Operations - Using Methods</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
        margin-top: 40px;
      }

      .container {
        width: 500px;
        max-width: 90%;
        margin: auto;
        padding: 25px;
        background-color: white;
        border: 1px solid #aaa;
        border-radius: 8px;
        box-sizing: border-box;
      }

      input {
        width: 90%;
        padding: 10px;
        margin: 8px;
        box-sizing: border-box;
      }

      button {
        padding: 10px 15px;
        margin: 5px;
        cursor: pointer;
      }

      #arrayInputs {
        margin-top: 15px;
      }

      #result {
        margin-top: 20px;
        padding: 15px;
        background-color: #eee;
        line-height: 1.8;
        overflow-wrap: anywhere;
      }

      .error {
        color: #d93025;
        font-size: 13px;
        margin: 0 0 8px;
        text-align: left;
        padding-left: 5%;
      }

      .success {
        color: #188038;
      }

      .input-group {
        margin-bottom: 10px;
      }

      .input-group input {
        margin-bottom: 4px;
      }

      hr {
        margin: 25px 0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Array Operations</h1>

      <!-- Array size -->
      <div class="input-group">
        <label for="arrayLength">Enter Array Size:</label>

        <input
          type="number"
          id="arrayLength"
          min="1"
          step="1"
          placeholder="Enter array length"
        />

        <div id="sizeError" class="error"></div>
      </div>

      <button onclick="generateInputs()">Generate Inputs</button>

      <!-- Dynamic input fields -->
      <div id="arrayInputs"></div>

      <button id="createButton" onclick="createArray()" hidden>
        Create Array
      </button>

      <hr />

      <!-- Delete operation -->
      <h3>Delete an Element</h3>

      <div class="input-group">
        <input
          type="text"
          id="deleteElement"
          placeholder="Enter element to delete"
        />

        <div id="deleteError" class="error"></div>
      </div>

      <button onclick="deleteElement()">Delete Element</button>

      <hr />

      <!-- Search operation -->
      <h3>Search an Element</h3>

      <div class="input-group">
        <input
          type="text"
          id="searchElement"
          placeholder="Enter element to search"
        />

        <div id="searchError" class="error"></div>
      </div>

      <button onclick="searchElement()">Search Element</button>

      <hr />

      <button onclick="emptyArray()">Empty Array</button>

      <!-- Output -->
      <div id="result">Result will appear here.</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
